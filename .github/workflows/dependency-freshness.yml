name: dependency freshness

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Report pinned action freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report-action-freshness.py
      - name: Report repository advisory drift
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validation_status=0
          python3 .github/scripts/validate-repos.py 2>&1 | tee /tmp/validator.log || validation_status=$?
          echo "### Repository advisory drift" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/validator.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$validation_status" -ne 0 ]; then
            echo "Validation failed (exit $validation_status); inspect the report for hard failures or incomplete execution." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$validation_status"
      - name: Report external README link health
        run: python3 .github/scripts/report-external-links.py
      - name: Report advisory triage
        run: python3 .github/scripts/report-advisory-triage.py
